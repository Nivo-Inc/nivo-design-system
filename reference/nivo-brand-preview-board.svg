<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 2400 1800" width="2400" height="1800">
  <title>Nivo brand preview board</title>
  <desc>Brand applications using the locked Nivo SVG geometry without alteration.</desc>
  <defs>
    <!-- Locked mark. Path data copied verbatim from nivo_mark_refined.svg (source SHA-256: 8bad8637598c026a68a3ac3701c2376215882693dd22858a1745609d03e97247). -->
    <symbol id="nivo-mark" viewBox="0 0 411 431" preserveAspectRatio="xMidYMid meet">
      <path id="top_left" fill="#A285E8" d="M 62,20 L 68,20 A 42 42 0 0 1 110,62 L 110,179 A 30 30 0 0 1 80,209 L 65,209 A 45 56 0 0 1 20,153 L 20,62 A 42 42 0 0 1 62,20 Z"></path>
      <path id="bottom_left" fill="#6A9BF3" d="M 50,223 L 65,223 A 45 45 0 0 1 110,268 L 110,368 A 42 42 0 0 1 68,410 L 62,410 A 42 42 0 0 1 20,368 L 20,253 A 30 30 0 0 1 50,223 Z"></path>
      <path id="diagonal" fill="#A0E1C6" d="M 140,200.9 L 140,149.1 A 22 22 0 0 1 177.6,133.6 L 265.6,221.6 A 22 22 0 0 1 272,237.1 L 272,288.9 A 22 22 0 0 1 234.4,304.4 L 146.4,216.4 A 22 22 0 0 1 140,200.9 Z"></path>
      <path id="top_right" fill="#8EDDBF" d="M 337,26 L 346,26 A 45 45 0 0 1 391,71 L 391,185 A 32 32 0 0 1 359,217 L 346,217 A 45 45 0 0 1 301,172 L 301,62 A 36 36 0 0 1 337,26 Z"></path>
      <path id="bottom_right" fill="#F2C77F" d="M 323,251 L 357,251 A 34 34 0 0 1 391,285 L 391,366 A 44 44 0 0 1 347,410 L 341,410 A 40 40 0 0 1 301,370 L 301,273 A 22 22 0 0 1 323,251 Z"></path>
    </symbol>

    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#17263D" flood-opacity="0.07"/>
    </filter>
    <filter id="icon-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#17263D" flood-opacity="0.14"/>
    </filter>
    <clipPath id="context-clip"><rect x="1340" y="756" width="964" height="440" rx="34"/></clipPath>
    <clipPath id="site-clip"><rect x="688" y="1293" width="1566" height="344" rx="24"/></clipPath>

    <style>
      .ui { font-family: Inter, "Avenir Next", Avenir, Helvetica, Arial, sans-serif; }
      .navy { fill: #17263D; }
      .muted { fill: #6F746F; }
      .eyebrow { fill: #6F746F; font-size: 20px; font-weight: 650; letter-spacing: 3.2px; }
      .card-title { fill: #17263D; font-size: 28px; font-weight: 650; letter-spacing: -0.4px; }
      .micro { fill: #7A7B75; font-size: 18px; font-weight: 500; letter-spacing: 0.2px; }
      .wordmark { font-family: Inter, "Avenir Next", Avenir, Helvetica, Arial, sans-serif; font-weight: 650; letter-spacing: -0.065em; }
      .card { fill: #FBF9F5; stroke: #E4DED5; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="2400" height="1800" fill="#F2EEE7"/>
  <circle cx="2268" cy="100" r="160" fill="#A0E1C6" opacity="0.13"/>
  <circle cx="2370" cy="360" r="88" fill="#F2C77F" opacity="0.18"/>
  <circle cx="68" cy="1730" r="145" fill="#A285E8" opacity="0.10"/>

  <!-- Board heading -->
  <g class="ui">
    <text x="96" y="102" class="eyebrow">NIVO · BRAND PREVIEW</text>
    <text x="96" y="178" class="navy" font-size="68" font-weight="650" letter-spacing="-2.8">A clear identity with a little warmth.</text>
    <g transform="translate(2042 74)">
      <rect width="262" height="54" rx="27" fill="#FBF9F5" stroke="#DDD6CC"/>
      <circle cx="30" cy="27" r="6" fill="#8EDDBF"/>
      <text x="51" y="35" class="navy" font-size="19" font-weight="650" letter-spacing="1.2">LOCKED MASTER</text>
    </g>
  </g>

  <!-- Mark only -->
  <g filter="url(#card-shadow)">
    <rect class="card" x="96" y="238" width="636" height="486" rx="34"/>
  </g>
  <g class="ui">
    <text x="140" y="288" class="eyebrow">01 · MARK ONLY</text>
    <use xlink:href="#nivo-mark" x="245" y="330" width="338" height="354"/>
    <text x="140" y="680" class="micro">Original colorway · geometry unchanged</text>
  </g>

  <!-- Primary horizontal lockup -->
  <g filter="url(#card-shadow)">
    <rect class="card" x="764" y="238" width="1540" height="486" rx="34"/>
  </g>
  <g class="ui">
    <text x="808" y="288" class="eyebrow">02 · PRIMARY HORIZONTAL LOCKUP</text>
    <g transform="translate(970 354)">
      <use xlink:href="#nivo-mark" x="0" y="0" width="216" height="226"/>
      <text x="276" y="183" class="wordmark navy" font-size="226">nivo</text>
    </g>
    <line x1="970" y1="621" x2="2100" y2="621" stroke="#E6E0D7" stroke-width="2"/>
    <circle cx="995" cy="663" r="10" fill="#A285E8"/>
    <circle cx="1024" cy="663" r="10" fill="#6A9BF3"/>
    <circle cx="1053" cy="663" r="10" fill="#A0E1C6"/>
    <circle cx="1082" cy="663" r="10" fill="#8EDDBF"/>
    <circle cx="1111" cy="663" r="10" fill="#F2C77F"/>
    <text x="1142" y="670" class="micro">Deep navy wordmark · original pastel mark</text>
  </g>

  <!-- Stacked lockup -->
  <g filter="url(#card-shadow)">
    <rect class="card" x="96" y="756" width="520" height="440" rx="34"/>
  </g>
  <g class="ui">
    <text x="140" y="806" class="eyebrow">03 · STACKED</text>
    <use xlink:href="#nivo-mark" x="242" y="844" width="228" height="239"/>
    <text x="260" y="1153" class="wordmark navy" font-size="122">nivo</text>
  </g>

  <!-- App icons -->
  <g filter="url(#card-shadow)">
    <rect class="card" x="648" y="756" width="660" height="440" rx="34"/>
  </g>
  <g class="ui">
    <text x="692" y="806" class="eyebrow">04 · APP ICONS</text>
    <g filter="url(#icon-shadow)">
      <rect x="706" y="858" width="232" height="232" rx="58" fill="#F7F3ED" stroke="#DFD8CE" stroke-width="2"/>
      <rect x="1018" y="858" width="232" height="232" rx="58" fill="#17263D"/>
    </g>
    <use xlink:href="#nivo-mark" x="766" y="918" width="112" height="117"/>
    <use xlink:href="#nivo-mark" x="1078" y="918" width="112" height="117"/>
    <text x="776" y="1144" class="micro">LIGHT</text>
    <text x="1086" y="1144" class="micro">DARK</text>
  </g>

  <!-- Background lockups -->
  <g filter="url(#card-shadow)">
    <rect class="card" x="1340" y="756" width="964" height="440" rx="34"/>
  </g>
  <g clip-path="url(#context-clip)">
    <rect x="1340" y="756" width="964" height="220" fill="#FCFAF6"/>
    <rect x="1340" y="976" width="964" height="220" fill="#17263D"/>
    <line x1="1340" y1="976" x2="2304" y2="976" stroke="#E4DED5" stroke-width="1.5"/>
  </g>
  <g class="ui">
    <text x="1384" y="806" class="eyebrow">05 · LIGHT / DARK</text>
    <g transform="translate(1514 832)">
      <use xlink:href="#nivo-mark" x="0" y="0" width="102" height="107"/>
      <text x="132" y="87" class="wordmark navy" font-size="112">nivo</text>
    </g>
    <g transform="translate(1514 1026)">
      <use xlink:href="#nivo-mark" x="0" y="0" width="102" height="107"/>
      <text x="132" y="87" class="wordmark" fill="#FBF9F5" font-size="112">nivo</text>
    </g>
  </g>

  <!-- Small-size / favicon -->
  <g filter="url(#card-shadow)">
    <rect class="card" x="96" y="1228" width="520" height="476" rx="34"/>
  </g>
  <g class="ui">
    <text x="140" y="1278" class="eyebrow">06 · FAVICON / APP MARK</text>
    <g transform="translate(140 1324)">
      <rect width="432" height="76" rx="14" fill="#FFFFFF" stroke="#E2DDD5"/>
      <circle cx="28" cy="24" r="5" fill="#D6D1C9"/>
      <circle cx="46" cy="24" r="5" fill="#D6D1C9"/>
      <circle cx="64" cy="24" r="5" fill="#D6D1C9"/>
      <rect x="88" y="14" width="230" height="48" rx="12" fill="#F2EEE7"/>
      <use xlink:href="#nivo-mark" x="106" y="26" width="23" height="24"/>
      <text x="143" y="47" class="navy" font-size="20" font-weight="600">nivo</text>
    </g>
    <text x="140" y="1456" class="micro">EXACT MARK AT COMMON SIZES</text>
    <g transform="translate(140 1498)">
      <use xlink:href="#nivo-mark" x="0" y="20" width="16" height="17"/>
      <use xlink:href="#nivo-mark" x="64" y="16" width="24" height="25"/>
      <use xlink:href="#nivo-mark" x="144" y="12" width="32" height="34"/>
      <use xlink:href="#nivo-mark" x="240" y="4" width="48" height="50"/>
      <use xlink:href="#nivo-mark" x="344" y="0" width="57" height="60"/>
      <text x="0" y="91" class="micro">16</text>
      <text x="64" y="91" class="micro">24</text>
      <text x="144" y="91" class="micro">32</text>
      <text x="240" y="91" class="micro">48</text>
      <text x="344" y="91" class="micro">60</text>
    </g>
    <rect x="140" y="1632" width="166" height="42" rx="21" fill="#EAE4DC"/>
    <text x="164" y="1660" class="navy" font-size="17" font-weight="650" letter-spacing="1">NO SIMPLIFICATION</text>
  </g>

  <!-- Website header example -->
  <g filter="url(#card-shadow)">
    <rect class="card" x="648" y="1228" width="1656" height="476" rx="34"/>
  </g>
  <g class="ui">
    <text x="692" y="1278" class="eyebrow">07 · WEBSITE HEADER EXAMPLE</text>
    <g clip-path="url(#site-clip)">
      <rect x="688" y="1293" width="1566" height="344" fill="#FCFAF6"/>
      <rect x="688" y="1293" width="1566" height="96" fill="#FFFFFF"/>
      <line x1="688" y1="1389" x2="2254" y2="1389" stroke="#E8E3DC" stroke-width="1.5"/>
      <circle cx="2160" cy="1622" r="185" fill="#A0E1C6" opacity="0.22"/>
      <circle cx="2040" cy="1650" r="112" fill="#A285E8" opacity="0.12"/>
      <circle cx="2234" cy="1495" r="70" fill="#F2C77F" opacity="0.23"/>
    </g>
    <!-- site nav logo -->
    <g transform="translate(738 1315)">
      <use xlink:href="#nivo-mark" x="0" y="0" width="50" height="52"/>
      <text x="66" y="45" class="wordmark navy" font-size="56">nivo</text>
    </g>
    <g fill="#465063" font-size="20" font-weight="550">
      <text x="1392" y="1352">Product</text>
      <text x="1507" y="1352">Solutions</text>
      <text x="1641" y="1352">About</text>
    </g>
    <text x="1799" y="1352" class="navy" font-size="20" font-weight="650">Sign in</text>
    <rect x="1902" y="1316" width="278" height="52" rx="26" fill="#17263D"/>
    <text x="1981" y="1351" fill="#FFFFFF" font-size="20" font-weight="650">Get started</text>

    <text x="752" y="1451" fill="#6D716C" font-size="17" font-weight="650" letter-spacing="2.2">THOUGHTFUL BY DESIGN</text>
    <text x="752" y="1531" class="navy" font-size="60" font-weight="650" letter-spacing="-2.4">Clarity, without the noise.</text>
    <text x="752" y="1582" fill="#646B69" font-size="24" font-weight="450">A calmer way to keep important work moving.</text>
    <rect x="752" y="1611" width="184" height="56" rx="28" fill="#17263D"/>
    <text x="798" y="1648" fill="#FFFFFF" font-size="20" font-weight="650">Explore Nivo</text>
    <rect x="952" y="1611" width="164" height="56" rx="28" fill="#EFE9E0" stroke="#DDD6CC"/>
    <text x="998" y="1648" class="navy" font-size="20" font-weight="650">Learn more</text>
  </g>

  <g class="ui">
    <text x="648" y="1752" class="micro">NIVO IDENTITY SYSTEM · PREVIEW 01</text>
    <text x="2304" y="1752" class="micro" text-anchor="end">Original geometry · restrained color · practical application</text>
  </g>
</svg>
